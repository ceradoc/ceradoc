# Fixture corpus for the round-trip harness, as globs relative to the repo root.
# Set CERADOC_ROUNDTRIP_EXTRA to a directory to add an external corpus
# (e.g. mn-samples, plateau): *.adoc are checked as asciidoc, *.md and
# *.markdown as markdown.
asciidoc:
  - 'README*.adoc'
  - 'roundtrip/corpus/**/*.adoc'
  - 'ceradoc*/README.adoc'
  - 'ceradoc/spec/fixtures/**/*.adoc'
  - 'ceradoc-plugin-kotoshu/spec/fixtures/**/*.adoc'
  - 'examples/**/*.adoc'
  - 'docs/**/*.adoc'
markdown:
  - 'ceradoc-markdown/spec/fixtures/**/*.text'
  - 'BUGREPORT.model-driven/*.md'
