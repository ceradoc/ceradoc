---
attributes: []
blocks:
- attributes: []
  ordered: false
  items:
  - attributes: []
    text: some item
    sublist:
      attributes: []
      ordered: false
      items:
      - attributes: []
        text: nested
        children: []
    children:
    - attributes: []
      content: some item
  - attributes: []
    text: |-
      last item
      ^
      *	some text
    children:
    - attributes: []
      content: last item
    - attributes: []
      content: "\n"
    - attributes: []
      content: "^"
    - attributes: []
      content: "\n"
    - attributes: []
      content: "*"
    - attributes: []
      content: "\tsome text"
- attributes: []
  text: "\t* nested"
  children:
  - attributes: []
    content: "\t"
  - attributes: []
    content: "*"
  - attributes: []
    content: " nested"
