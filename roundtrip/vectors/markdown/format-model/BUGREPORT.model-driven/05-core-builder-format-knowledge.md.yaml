  text: 5C. `extract_level` decodes `=` prefixed levels
- attributes: []
  text: "`lib/ceradoc/core_model/builder/detection.rb:157-165`:"
  children:
  - attributes: []
    text: lib/ceradoc/core_model/builder/detection.rb:157-165
  - attributes: []
    content: ":"
- attributes: []
  language: ruby
  code: |-
    def extract_level(ast)
      if ast[:level]
        level_str = ast[:level].to_s
        return level_str.length - 1 if level_str.start_with?('=')
        return level_str.to_i if level_str.match?(/^\d+$/)
      end
      1
    end
