  text: 5A. `detect_marker_type` maps AsciiDoc markers to names
- attributes: []
  text: "`lib/ceradoc/core_model/builder/detection.rb:107-115`:"
  children:
  - attributes: []
    text: lib/ceradoc/core_model/builder/detection.rb:107-115
  - attributes: []
    content: ":"
- attributes: []
  language: ruby
  code: |-
    def detect_marker_type(ast)
      marker = ast[:marker]&.to_s
      return 'asterisk' if marker&.start_with?('*')
      return 'dash' if marker&.start_with?('-')
      return 'numbered' if marker&.match?(/^\d+\./) || marker&.start_with?('.')
      return 'labeled' if marker&.end_with?('::')
      'asterisk'
    end
- attributes: []
  text: '`::` for labeled lists is purely AsciiDoc. The default `''asterisk''` is
    AsciiDoc''s default. Markdown uses `-`, `*`, `+` for unordered and `1.` for ordered
    — no "labeled" type.'
