---
type: DocumentElement
children:
- type: ListBlock
  marker_type: unordered
  items:
  - type: ListItem
    children:
    - type: TextContent
      text: some item
    marker: "*"
    content: some item
    nested_list:
      type: ListBlock
      marker_type: unordered
      items:
      - type: ListItem
        children: []
        marker: "*"
        content: nested
  - type: ListItem
    children:
    - type: TextContent
      text: last item
    - type: TextContent
      text: "\n"
    - type: TextContent
      text: "^"
    - type: TextContent
      text: "\n"
    - type: TextContent
      text: "*"
    - type: TextContent
      text: "\tsome text"
    marker: "*"
    content: |-
      last item
      ^
      *	some text
- type: ParagraphBlock
  children:
  - type: TextContent
    text: "\t"
  - type: TextContent
    text: "*"
  - type: TextContent
    text: " nested"
  content: "\t* nested"
  callouts: []
