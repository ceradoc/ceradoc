---
type: DocumentElement
children:
- type: ListBlock
  marker_type: unordered
  items:
  - type: ListItem
    children:
    - type: TextContent
      text: footnotes will be placed here
    - type: TextContent
      text: "\n"
    - type: TextContent
      text: "{:footnotes}"
    marker: "*"
    content: |-
      footnotes will be placed here
      {:footnotes}
- type: ParagraphBlock
  children:
  - type: TextContent
    text: Some para with a[^1] footnote.
  content: Some para with a[^1] footnote.
  callouts: []
- type: Footnote
  id: '1'
  content: Footnote \\\` text
  backlink: true
- type: ParagraphBlock
  children:
  - type: TextContent
    text: And another para.
  content: And another para.
  callouts: []
