      text: This document was developed in response to worldwide demand for minimum
        specifications for rice traded internationally, since most commercial bulks
        of grain, which have not been screened or aspirated, contain a proportion
        of other grains, weed seeds, chaff, straw, stones, sand, etc. The vegetable
        materials can have physical and biological properties which differ from those
        of the main constituent and can therefore affect the storage behaviour.
