    - type: TextContent
      text: Rice is a permanent host to a considerable microflora; most of these microorganisms
        are cosmopolitan, the majority are innocuous, but some produce harmful by-products.
        Microflora communities present on freshly harvested rice include many types
        of bacteria, moulds and yeasts. While the rice is ripening and its moisture
        content is falling, the number of field microorganisms, mainly bacteria, diminishes.
        When the rice is harvested, it is invaded by storage microorganisms and the
        field microflora gradually die out. If the mass fraction of moisture (formerly
        expressed as moisture content) is less than 18 %, the microflora does not
        multiply, whereas above 18 % it does so rapidly. Thus, at harvest, the qualitative
        and the quantitative composition of the microflora depends more upon ecological
        factors than upon the variety of the rice. During transport and storage, additions
        to the microfloral population occur. Microorganisms on the rice at harvest
        tend to die out during storage and are replaced by microorganisms adapted
        to storage conditions.
