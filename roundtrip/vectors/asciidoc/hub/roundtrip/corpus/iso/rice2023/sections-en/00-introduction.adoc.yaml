      text: Storage losses have been estimated as being an average of 5 %, and as
        much as 30 %, especially in regions with climates favourable to the rapid
        development of agents of deterioration, such as tropical climates. The magnitude
        of these figures highlights the need to promote a rapid improvement in techniques
        of conservation worldwide.
