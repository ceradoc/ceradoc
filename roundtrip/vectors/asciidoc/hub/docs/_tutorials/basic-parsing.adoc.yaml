  id: _example_1_parse_a_simple_document
  title: 'Example 1: Parse a Simple Document'
  source_line: 24
  level: 1
  children:
  - type: SectionElement
    id: _example_1_parse_a_simple_document_the_code
    title: The Code
    source_line: 26
    level: 2
    children:
    - type: SourceBlock
      source_line: 28
      children: []
      content: |-
        require 'ceradoc'
        input = <<~ASCIIDOC
          = Hello World
          This is a paragraph.
          == Section 1
          This is content in section 1.
        ASCIIDOC
        doc = Ceradoc.parse(input)
        puts "Document title: #{doc.header.title}"
        puts "Number of sections: #{doc.sections.size}"
        # Find the first actual Section
        section = doc.sections.find { |s| s.is_a?(Ceradoc::Model::Section) }
        if section
          puts "First section title: #{section.title.content}"
        end
      lines:
