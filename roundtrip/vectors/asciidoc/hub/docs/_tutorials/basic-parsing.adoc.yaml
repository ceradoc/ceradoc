- type: SectionElement
  id: _example_5_parse_blocks
  title: 'Example 5: Parse Blocks'
  source_line: 227
  level: 1
  children:
  - type: SectionElement
    id: _example_5_parse_blocks_the_code
    title: The Code
    source_line: 229
    level: 2
    children:
    - type: SourceBlock
      source_line: 231
      children: []
      content: |-
        require 'ceradoc'
        input = <<~ASCIIDOC
          = Blocks
          [source,ruby]
          ----
          def hello
            puts "Hello, World!"
          end
          ----
          ____
          Quoted text block.
          ____
          NOTE: This is a note admonition.
        ASCIIDOC
        doc = Ceradoc.parse(input)
        # Find section with blocks
        section = doc.sections.find { |s| s.is_a?(Ceradoc::Model::Section) }
        if section
          puts "Block types in document:"
          section.contents.each do |block|
            puts "  - #{block.class.name}"
            if block.respond_to?(:lines)
              puts "    Lines: #{block.lines.size}"
            end
            if block.respond_to?(:content)
              puts "    Content: #{block.content}"
            end
          end
        end
      lines:
      - require 'ceradoc'
      - input = <<~ASCIIDOC
      - "  = Blocks"
      - "  [source,ruby]"
      - "  ----"
      - "  def hello"
      - '    puts "Hello, World!"'
      - "  end"
      - "  ----"
      - "  ____"
      - "  Quoted text block."
      - "  ____"
