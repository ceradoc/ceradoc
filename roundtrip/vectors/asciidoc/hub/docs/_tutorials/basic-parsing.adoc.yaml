- type: SectionElement
  id: _example_2_parse_from_file
  title: 'Example 2: Parse from File'
  source_line: 68
  level: 1
  children:
  - type: SectionElement
    id: _example_2_parse_from_file_the_code
    title: The Code
    source_line: 70
    level: 2
    children:
    - type: SourceBlock
      source_line: 72
      children: []
      content: |-
        require 'ceradoc'
        # Create a temporary file
        temp_file = "/tmp/ceradoc_example.adoc"
        File.write(temp_file, <<~ASCIIDOC)
          = Document Title
          Author Name <author@example.com>
          == Introduction
          This is the introduction paragraph.
          * List item 1
          * List item 2
          * List item 3
        ASCIIDOC
        doc = Ceradoc.parse_file(temp_file)
        puts "Document title: #{doc.header.title}"
        puts "Author: #{doc.header.author&.first&.name}"
        section = doc.sections.find { |s| s.is_a?(Ceradoc::Model::Section) }
        if section
          paragraphs = section.contents.select { |c| c.is_a?(Ceradoc::Model::Paragraph) }
          lists = section.contents.select { |c| c.is_a?(Ceradoc::Model::List::Core) }
          puts "Number of paragraphs: #{paragraphs.size}"
          puts "Number of lists: #{lists.size}"
        end
        # Cleanup
        File.delete(temp_file) if File.exist?(temp_file)
