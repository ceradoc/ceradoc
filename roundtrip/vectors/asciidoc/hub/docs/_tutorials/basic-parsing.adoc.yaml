          = Lists
          * Unordered item 1
          ** Nested item
          * Unordered item 2
          . Ordered item 1
          . Ordered item 2
          . Ordered item 3
          [horizontal]
          Term 1:: Definition 1
          Term 2:: Definition 2
        ASCIIDOC
        doc = Ceradoc.parse(input)
        # Find all list objects at document level
        lists = doc.sections.select { |s| s.is_a?(Ceradoc::Model::List::Core) }
        puts "Number of lists: #{lists.size}"
        lists.each_with_index do |list, i|
          puts "  List #{i + 1}: #{list.class.name} with #{list.items.size} items"
        end
