    - type: SourceBlock
      source_line: 164
      children: []
      content: |-
        require 'ceradoc'
        original = <<~ASCIIDOC
          = Main
          == Section 1
          === Subsection 1.1
          Content in 1.1
          === Subsection 1.2
          Content in 1.2
          == Section 2
          Content in section 2.
        ASCIIDOC
        doc1 = Ceradoc.parse(original)
        serialized = doc1.to_adoc
        doc2 = Ceradoc.parse(serialized)
        def count_sections(doc)
          count = 0
          doc.sections.each do |s|
            next unless s.is_a?(Ceradoc::Model::Section)
            count += 1
            count += count_sections(s)
          end
          count
        end
        puts "Original section count: #{count_sections(doc1)}"
        puts "Re-parsed section count: #{count_sections(doc2)}"
