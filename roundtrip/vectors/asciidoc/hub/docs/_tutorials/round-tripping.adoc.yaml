      content: |-
        require 'ceradoc'
        original = <<~ASCIIDOC
          = Blocks
          [source,ruby]
          ----
          def hello
            puts "world"
          end
          ----
          ____
          Quote block.
          ____
          NOTE: Admonition block.
        ASCIIDOC
        doc1 = Ceradoc.parse(original)
        serialized = doc1.to_adoc
        doc2 = Ceradoc.parse(serialized)
        def block_types(doc)
          section = doc.sections.find { |s| s.is_a?(Ceradoc::Model::Section) }
          return [] unless section
          section.contents.map { |b| b.class.name }
        end
        puts "Original block types: #{block_types(doc1).join(', ')}"
        puts "Re-parsed block types: #{block_types(doc2).join(', ')}"
