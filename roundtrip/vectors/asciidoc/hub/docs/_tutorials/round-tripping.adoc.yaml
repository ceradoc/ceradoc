  id: _example_3_preserving_nested_structure
  title: 'Example 3: Preserving Nested Structure'
  source_line: 160
  level: 1
  children:
  - type: SectionElement
    id: _example_3_preserving_nested_structure_the_code
    title: The Code
    source_line: 162
