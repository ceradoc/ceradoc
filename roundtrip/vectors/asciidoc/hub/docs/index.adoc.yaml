- type: SectionElement
  id: _quick_start
  title: Quick Start
  source_line: 20
  level: 1
  children:
  - type: SourceBlock
    source_line: 22
    children: []
    content: |-
      # Parse AsciiDoc input
      doc = Ceradoc.parse("== Hello World\n\nThis is a paragraph.")
      # Access document structure
      doc.header.title                    # => "Hello World"
      doc.sections.first.title.level_int  # => 2
      # Serialize back to AsciiDoc
      output = doc.to_adoc
    lines:
    - "# Parse AsciiDoc input"
    - doc = Ceradoc.parse("== Hello World\n\nThis is a paragraph.")
    - "# Access document structure"
    - 'doc.header.title                    # => "Hello World"'
    - 'doc.sections.first.title.level_int  # => 2'
    - "# Serialize back to AsciiDoc"
    - output = doc.to_adoc
    language: ruby
    callouts: []
