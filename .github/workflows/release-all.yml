name: release-all

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch (or pre|rc|etc).
          Pass 'skip' to skip version bump and release gems at current versions.
        required: true
        default: 'skip'
      gems:
        description: |
          Comma-separated list of gems to release (e.g. 'ceradoc,ceradoc-adoc').
          Leave empty to release ALL gems.
        required: false
        default: ''
      dry_run:
        description: 'Dry run (build only, do not push to RubyGems)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Determine gems to release
      id: gems
      run: |
        ALL_GEMS="ceradoc ceradoc-adoc ceradoc-docx ceradoc-markdown ceradoc-html"
        INPUT="${{ inputs.gems }}"
        if [ -z "$INPUT" ]; then
          echo "targets=$ALL_GEMS" >> "$GITHUB_OUTPUT"
          echo "Releasing all gems: $ALL_GEMS"
        else
          # Validate input gems exist
          for g in $(echo "$INPUT" | tr ',' ' '); do
            if ! echo "$ALL_GEMS" | grep -qw "$g"; then
              echo "::error::Unknown gem: $g. Valid gems: $ALL_GEMS"
              exit 1
            fi
          done
          TARGETS=$(echo "$INPUT" | tr ',' ' ')
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "Releasing selected gems: $TARGETS"
        fi

    - name: Bump versions
      if: inputs.next_version != 'skip'
      run: |
        BUMP="${{ inputs.next_version }}"

        bump_version() {
          local current="$1"
          local major minor patch pre
          # Parse version, stripping any pre-release suffix
          version_base="${current%%-*}"
          pre="${current#"$version_base"}"
          pre="${pre#-}"
          IFS='.' read -r major minor patch <<< "$version_base"
          case "$BUMP" in
            major)   major=$((major + 1)); minor=0; patch=0; pre="" ;;
            minor)   minor=$((minor + 1)); patch=0; pre="" ;;
            patch)   patch=$((patch + 1)); pre="" ;;
            *)       # Assume explicit version like x.y.z
              echo "$BUMP"
              return
              ;;
          esac
          if [ -n "$pre" ]; then
            echo "${major}.${minor}.${patch}-${pre}"
          else
            echo "${major}.${minor}.${patch}"
          fi
        }

        for gem in ${{ steps.gems.outputs.targets }}; do
          case "$gem" in
            ceradoc)        version_file="ceradoc/lib/ceradoc/version.rb" ;;
            ceradoc-adoc)   version_file="ceradoc-adoc/lib/ceradoc/asciidoc/version.rb" ;;
            ceradoc-docx)   version_file="ceradoc-docx/lib/ceradoc/docx/version.rb" ;;
            ceradoc-html)   version_file="ceradoc-html/lib/ceradoc/html/version.rb" ;;
            ceradoc-markdown) version_file="ceradoc-markdown/lib/ceradoc/markdown/version.rb" ;;
          esac

          current=$(grep -oP "VERSION\s*=\s*'\K[^']+" "$version_file")
          new_version=$(bump_version "$current")

          if [ "$new_version" != "$current" ]; then
            echo "Bumping $gem: $current -> $new_version"
            sed -i "s/VERSION\s*=\s*'[^']*'/VERSION = '$new_version'/" "$version_file"
          else
            echo "$gem already at $current, no bump needed"
          fi
        done

    - name: Commit version bumps
      if: inputs.next_version != 'skip'
      run: |
        if git diff --quiet; then
          echo "No version changes to commit"
        else
          git add \
            ceradoc/lib/ceradoc/version.rb \
            ceradoc-adoc/lib/ceradoc/asciidoc/version.rb \
            ceradoc-docx/lib/ceradoc/docx/version.rb \
            ceradoc-html/lib/ceradoc/html/version.rb \
            ceradoc-markdown/lib/ceradoc/markdown/version.rb
          git commit -m "chore: bump gem versions for release"
          git push origin main
        fi

    - name: Build gems
      run: |
        for gem in ${{ steps.gems.outputs.targets }}; do
          echo "Building $gem..."
          (cd "$gem" && gem build *.gemspec)
        done

    - name: Collect built gems
      run: |
        for gem in ${{ steps.gems.outputs.targets }}; do
          mv "$gem"/*.gem . 2>/dev/null || true
        done
        ls -la *.gem

    - name: Release gems to RubyGems (trusted publishing)
      if: ${{ !inputs.dry_run }}
      uses: rubygems/release-gem@v1

    - name: Dry run summary
      if: ${{ inputs.dry_run }}
      run: |
        echo "## Dry Run Summary"
        echo "Gems that would be released:"
        for gem in ${{ steps.gems.outputs.targets }}; do
          gem_file=$(ls "$gem"/*.gem 2>/dev/null | head -1)
          if [ -n "$gem_file" ]; then
            echo "  - $(basename "$gem_file")"
          fi
        done

    - name: Cleanup
      if: always()
      run: find . -name "*.gem" -not -path "*/vendor/*" -delete
