name: release

on:
  workflow_dispatch:
    inputs:
      gem_name:
        description: Select gem to release
        required: true
        type: choice
        options:
          - ceradoc
          - ceradoc-adoc
          - ceradoc-html
          - ceradoc-markdown
          - ceradoc-docx
          - ceradoc-mirror
      next_version:
        description: >-
          Next release version. Possible values: x.y.z, major, minor,
          patch (or pre|rc|etc).  Pass 'skip' to skip 'git tag' and do
          'gem push' for the current version.
        required: true
        default: skip
  repository_dispatch:
    types: [do-release]
  # The recovery publish leg: if the dispatch run's 20-minute merge wait
  # timed out, the release PR (head release/*) merging still triggers this
  # workflow, and the reusable publishes from the merge commit
  # (metanorma/ci#515). Ordinary PR closes are skipped inside the reusable.
  pull_request:
    types:
      - closed

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: metanorma/ci/.github/workflows/monorepo-rubygems-release.yml@main
    with:
      # gated=false: ceradoc has no test→do-release relay wired up, and
      # metanorma/ci's do-release payload doesn't carry gem-name, so gated
      # mode can never publish the right gem. Publish immediately on
      # workflow_dispatch; the idempotency guard handles any duplicates.
      gated: false
      gem_name: ${{ github.event.client_payload.gem-name || github.event.inputs.gem_name || 'ceradoc' }}
      gem_directory: '.'
      next_version: ${{ github.event.inputs.next_version || 'skip' }}
      version_file: >-
        ${{
          (github.event.inputs.gem_name == 'ceradoc-adoc' && 'lib/ceradoc/asciidoc/version.rb') ||
          (github.event.inputs.gem_name == 'ceradoc-html' && 'lib/ceradoc/html/version.rb') ||
          (github.event.inputs.gem_name == 'ceradoc-markdown' && 'lib/ceradoc/markdown/version.rb') ||
          (github.event.inputs.gem_name == 'ceradoc-docx' && 'lib/ceradoc/docx/version.rb') ||
          (github.event.inputs.gem_name == 'ceradoc-mirror' && 'lib/ceradoc/mirror/version.rb') ||
          ''
        }}
    # The release-PR creation runs on the CERADOC_CI_PAT_TOKEN when set
    # (the reusable's HAVE_PAT_TOKEN path: checkout and gh-rubygems-setup
    # authenticate as the ceradoc-ci account, which the ceradoc org allows
    # to create pull requests — GITHUB_TOKEN is policy-blocked for PR
    # creation here, which stranded release/ceradoc-adoc-v2.0.38). Without
    # the secret the flow falls back to GITHUB_TOKEN + Trusted Publishing.
    secrets:
      pat_token: ${{ secrets.CERADOC_CI_PAT_TOKEN }}
