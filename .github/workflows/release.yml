name: release

on:
  workflow_dispatch:
    inputs:
      gem_name:
        description: Select gem to release
        required: true
        type: choice
        options:
          - coridoc
          - coridoc-adoc
          - coridoc-html
          - coridoc-markdown
          - coridoc-docx
          - coridoc-mirror
      next_version:
        description: >-
          Next release version. Possible values: x.y.z, major, minor,
          patch (or pre|rc|etc).  Pass 'skip' to skip 'git tag' and do
          'gem push' for the current version.
        required: true
        default: skip
  repository_dispatch:
    types: [do-release]
    types: [ do-release ]
  # The publish leg: when the release PR (head branch release/v*) merges,
  # metanorma/ci tags the merge commit and publishes (metanorma/ci#515).
  # Ordinary PR closes are skipped inside the reusable workflow.
  pull_request:
    types:
      - closed

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  release:
    uses: metanorma/ci/.github/workflows/monorepo-rubygems-release.yml@main
    with:
      # gated=false: coridoc has no test→do-release relay wired up, and
      # metanorma/ci's do-release payload doesn't carry gem-name, so gated
      # mode can never publish the right gem. Publish immediately on
      # workflow_dispatch; the idempotency guard handles any duplicates.
      gated: false
      gem_name: ${{ github.event.client_payload.gem-name || github.event.inputs.gem_name || 'coridoc' }}
      gem_directory: '.'
      next_version: ${{ github.event.inputs.next_version || 'skip' }}
      version_file: >-
        ${{
          (github.event.inputs.gem_name == 'coridoc-adoc' && 'lib/coridoc/asciidoc/version.rb') ||
          (github.event.inputs.gem_name == 'coridoc-html' && 'lib/coridoc/html/version.rb') ||
          (github.event.inputs.gem_name == 'coridoc-markdown' && 'lib/coridoc/markdown/version.rb') ||
          (github.event.inputs.gem_name == 'coridoc-docx' && 'lib/coridoc/docx/version.rb') ||
          (github.event.inputs.gem_name == 'coridoc-mirror' && 'lib/coridoc/mirror/version.rb') ||
          ''
        }}
    secrets:
      rubygems-api-key: ${{ secrets.METANORMA_CI_RUBYGEMS_API_KEY }}
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
